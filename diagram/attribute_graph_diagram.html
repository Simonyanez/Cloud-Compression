<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttributeGraph Diagram</title>
    <link rel="stylesheet" href="rd_cluster_style.css">
    <style>
        .graph-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .graph {
            border: 2px solid #333;
            border-radius: 5px;
            padding: 20px;
            margin: 10px;
            width: 40%;
        }
        .graph h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>AttributeGraph Methodology</h1>
    <div class="graph-container">
        <div class="graph">
            <h2>Structural Graph</h2>
            <p>Based on Euclidean distance between nodes.</p>
            <svg width="100%" height="200">
                <!-- Simple graph representation -->
                <circle cx="50" cy="50" r="10" fill="#4caf50" />
                <circle cx="150" cy="50" r="10" fill="#4caf50" />
                <circle cx="100" cy="150" r="10" fill="#4caf50" />
                <line x1="50" y1="50" x2="150" y2="50" stroke="#333" />
                <line x1="50" y1="50" x2="100" y2="150" stroke="#333" />
                <line x1="150" y1="50" x2="100" y2="150" stroke="#333" />
            </svg>
        </div>
        <div class="arrow right"></div>
        <div class="graph">
            <h2>AttributeGraph</h2>
            <p>Structural graph with self-loops on "sink" nodes.</p>
            <svg width="100%" height="200">
                <!-- Simple graph representation with self-loop -->
                <circle cx="50" cy="50" r="10" fill="#4caf50" />
                <circle cx="150" cy="50" r="10" fill="#4caf50" />
                <circle cx="100" cy="150" r="10" fill="#ff9800" />
                <line x1="50" y1="50" x2="150" y2="50" stroke="#333" />
                <line x1="50" y1="50" x2="100" y2="150" stroke="#333" />
                <line x1="150" y1="50" x2="100" y2="150" stroke="#333" />
                <path d="M 100 130 A 20 20, 0, 1, 1, 120 150" stroke="#f44336" fill="none" />
            </svg>
        </div>
    </div>
</body>
</html>

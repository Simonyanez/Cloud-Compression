# CONFIG YAML
# This is the base configuration. For any experiment this can be overide.
#
experiment_metadata:
  experiment_name: "Self-looped"
  experiment_code: "RT01"
  experiment_date: "2025-08-31"
  experiment_info: "Bestie"
  export_folder: "results/PCADC_TEST"
  temp_folder: "results/temp"

pointcloud_metadata:
  point_cloud_dataset: "8iVFB v2"
  point_cloud_sequence: "longdress"
  point_cloud_depth: 10
  point_cloud_frame: 1051

sequential_params:
  point_cloud_path: "res/longdress_vox10_1051.ply"
  normalize_slopes: False
  decider_mode: 0
  self_loop_weight: 1.6 # This should be dynamic too. Part of the optimization problem
  self_loop_percentage: 0.85 # This should be dynamic too. Part of the optimization problem
  sample_percentage: 1.0
  quantization_steps: [24,24,24,24,24,24]
  lagrange_proportional: 0.8
  block_size: 16

clustering_params:
  number_of_clusters: 4
  max_iterations: 20
  min_iterations: 20
  rd_cost_threshold: 0.001
  iteration_window: 20
  initial_temperature: 1.0
  final_temperature: 0.0
  cooling_rate: 0.9
  learning_rate: 0.5

rewrite_results: False
debugging: False


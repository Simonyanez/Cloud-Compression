
# CONFIG YAML - FAST - Block Size 8
experiment_metadata:
  experiment_name: "RD Clustering - Fast - B8 - SLT 0.4"
  experiment_code: "RD-Fast-B8-SLT-0.4"
  experiment_date: "2025-12-05"
  experiment_info: "Fast execution for RD Clustering comparison with block size 8"
  export_folder: "results/PCADC_MEDIUM"
  temp_folder: "results/temp"

pointcloud_metadata:
  point_cloud_dataset: "8iVFB v2"
  point_cloud_sequence: "longdress"
  point_cloud_depth: 10
  point_cloud_frame: 1051

sequential_params:
  point_cloud_path: "res/longdress_vox10_1051.ply"
  normalize_slopes: True
  decider_mode: 0
  self_loop_weight: 2.0
  self_loop_threshold: 0.6
  quantization_steps: [24, 32, 48, 64]
  lagrange_proportional: 0.8
  block_size: 8

clustering_params:
  number_of_clusters: 2
  max_iterations: 30
  min_iterations: 2
  rd_cost_threshold: 0.01
  iteration_window: 5
  initial_temperature: 1.0
  final_temperature: 0.1
  cooling_rate: 0.9
  learning_rate: 0.5

rewrite_results: False
debugging: False
